# Сборка и релиз плагина. Запускается только по тегу версии:
#   git tag v1.2.0 && git push origin v1.2.0
# Версия плагина берётся из тега. На обычные коммиты ничего не собирается: репозиторий приватный,
# а минута macOS-раннера стоит как десять минут Linux.
# Пробная сборка без релиза — кнопкой Run workflow во вкладке Actions (архивы лежат в артефактах запуска).
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: macOS-arm64, targets: SauceGentraFX_VST3 SauceGentraFX_AU, jobs: --parallel 4 }
          # Visual Studio сама компилирует файлы проекта параллельно (/MP в CMakeLists.txt); если собирать параллельно
          # ещё и проекты, раннеру не хватает памяти.
          # windows-2022, а не latest: компилятор Visual Studio 2026 падает с внутренней ошибкой на Tests/PluginTest.cpp.
          - { os: windows-2022, name: Windows-x64, targets: SauceGentraFX_VST3, jobs: '' }
          # ubuntu-22.04, а не latest: плагин требует glibc не новее той, с которой собран, — старый образ запускается у большего числа людей.
          - { os: ubuntu-22.04, name: Linux-x64, targets: SauceGentraFX_VST3, jobs: --parallel 4 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "cmake=-DGENTRA_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT" # версия внутри плагина — из CMakeLists.txt
          fi

      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libfreetype-dev libfontconfig1-dev

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DGENTRA_COPY_AFTER_BUILD=OFF ${{ steps.version.outputs.cmake }}
          cmake --build build --config Release --target ${{ matrix.targets }} ${{ matrix.jobs }} # без Standalone: он только для локальной отладки

      - name: Test
        run: |
          cmake --build build --config Release --target GentraTest ${{ matrix.jobs }}
          # Тест открывает редактор плагина; на Linux для этого нужен X-сервер, на раннере его заменяет xvfb.
          ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} ctest --test-dir build -C Release --output-on-failure

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          out="Sauce Gentra FX ${{ steps.version.outputs.name }}"
          mkdir "$out"
          cd build/SauceGentraFX_artefacts/Release
          ditto "VST3/Sauce Gentra FX.vst3" "../../../$out/Sauce Gentra FX.vst3"
          ditto "AU/Sauce Gentra FX.component" "../../../$out/Sauce Gentra FX.component"
          cd ../../..
          ditto -c -k --keepParent "$out" "Sauce-Gentra-FX-${{ steps.version.outputs.name }}-${{ matrix.name }}.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "Sauce Gentra FX ${{ steps.version.outputs.name }}"
          New-Item -ItemType Directory $out | Out-Null
          Copy-Item -Recurse "build/SauceGentraFX_artefacts/Release/VST3/Sauce Gentra FX.vst3" $out
          Compress-Archive $out "Sauce-Gentra-FX-${{ steps.version.outputs.name }}-${{ matrix.name }}.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          out="Sauce Gentra FX ${{ steps.version.outputs.name }}"
          mkdir "$out"
          cp -r "build/SauceGentraFX_artefacts/Release/VST3/Sauce Gentra FX.vst3" "$out/"
          zip -r "Sauce-Gentra-FX-${{ steps.version.outputs.name }}-${{ matrix.name }}.zip" "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: Sauce-Gentra-FX-*.zip
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "Sauce Gentra FX ${GITHUB_REF_NAME#v}" --notes-file .github/release-notes.md --generate-notes
